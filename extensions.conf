; ================================================================
;  ASTERISK PBX — extensions.conf
;  Search & Rescue Proof of Concept Dialplan
; ================================================================
;
;  Context: sar-dialplan
;
;  Call flows:
;    200 calls 100 → rings Command Desk
;    100 calls 200 → rings Victim browser
;    Either party calls 999/911 → plays recorded message
;                                 (we are not routing to PSTN in PoC)
;    *97            → Voicemail access
;    *43            → Echo test (useful for audio troubleshooting)
;
;  Reload:  sudo asterisk -rx "dialplan reload"
;  CLI:     sudo asterisk -rvvvv
; ================================================================

[general]
static   = yes
writeprotect = no
clearglobalvars = no

; ──────────────────────────────────────────────────────────────
;  GLOBAL VARIABLES
; ──────────────────────────────────────────────────────────────
[globals]
COMMAND_EXT  = 100
VICTIM_EXT   = 200
RING_TIMEOUT = 60         ; Seconds to ring before going to voicemail/busy

; ──────────────────────────────────────────────────────────────
;  SAR DIALPLAN — Main Context
; ──────────────────────────────────────────────────────────────
[sar-dialplan]

; ── Extension 100: Command Desk (operator laptop) ─────────────
;
;  Priority chain:
;    1. Answer the inbound call leg
;    2. Set caller ID so operator sees who is calling
;    3. Dial ext 100 via PJSIP, ring for ${RING_TIMEOUT} seconds
;    4. If no answer → play a busy/unavailable message
;
exten => 100,1,NoOp(Incoming call to Command Desk from ${CALLERID(all)})
 same => n,Set(CALLERID(name)=Rescue Victim ${CHANNEL(pjsip,remote_addr)})
 same => n,Dial(PJSIP/100,${RING_TIMEOUT},t)
         ; 't' flag → allow caller to transfer (useful for PoC demo)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n(busy),Playback(all-circuits-busy-now)
 same => n,Hangup()
 same => n(noanswer),Playback(sorry-youre-having-problems)
 same => n,Playback(pls-hold-while-try-connect)
 same => n,Hangup()

; ── Extension 200: Victim WebRTC browser ─────────────────────
;
;  The operator can call back a victim on ext 200.
;  In a real deployment you might have multiple victim extensions
;  (201, 202, …) or use a conference bridge.
;
exten => 200,1,NoOp(Incoming call to Victim WebRTC from ${CALLERID(all)})
 same => n,Set(CALLERID(name)=Command Center)
 same => n,Dial(PJSIP/200,${RING_TIMEOUT})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy200)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?away200)
 same => n(busy200),Playback(all-circuits-busy-now)
 same => n,Hangup()
 same => n(away200),Playback(sorry-youre-having-problems)
 same => n,Hangup()

; ── Emergency numbers: graceful rejection in PoC ─────────────
;  We cannot route to PSTN in this PoC — inform the caller.
exten => 999,1,Answer()
 same => n,Playback(this-is-not-a-working-number)
 same => n,SayAlpha(RESCUE)
 same => n,Hangup()

exten => 911,1,GoTo(999,1)
exten => 112,1,GoTo(999,1)

; ── Echo test — for debugging audio quality ──────────────────
;  Dial *43 from any extension to hear your own voice echoed back.
;  Use this during jury demo to prove the audio path works.
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; ── Voicemail access ─────────────────────────────────────────
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; ── Conference bridge (optional — for multi-victim scenarios) ─
;  Dial 300 to join a conference room.
;  All parties can hear each other — useful for coordinating rescuers.
exten => 300,1,NoOp(Conference Room)
 same => n,Answer()
 same => n,ConfBridge(1,default_bridge,default_user)
 same => n,Hangup()

; ── Catch-all: invalid extension ─────────────────────────────
exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

; ──────────────────────────────────────────────────────────────
;  HINT CONTEXT  — for BLF (Busy Lamp Field) on operator phone
; ──────────────────────────────────────────────────────────────
[hints]
exten => 100,hint,PJSIP/100
exten => 200,hint,PJSIP/200
