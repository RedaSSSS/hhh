; ================================================================
;  ASTERISK PBX — pjsip.conf
;  Search & Rescue Proof of Concept
; ================================================================
;
;  Two extensions:
;    100 — Command Desk   (standard SIP softphone on operator laptop)
;    200 — Victim WebRTC  (browser-based SIP.js client)
;
;  WebRTC requires:
;    - WebSocket transport (WS or WSS)
;    - DTLS-SRTP for media encryption (mandatory for WebRTC)
;    - ICE support (enabled per endpoint)
;
;  Install prerequisites on Pi 3:
;    sudo apt-get install asterisk asterisk-config
;    sudo apt-get install libssl-dev  (for TLS/WSS support)
;
;  For WSS (TLS WebSocket), you need a self-signed cert:
;    sudo openssl req -x509 -newkey rsa:2048 -keyout /etc/asterisk/keys/ast.key \
;         -out /etc/asterisk/keys/ast.crt -days 365 -nodes \
;         -subj "/CN=10.0.0.1"
;
;  Reload after editing:
;    sudo asterisk -rx "module reload res_pjsip.so"
; ================================================================


; ──────────────────────────────────────────────────────────────
;  TRANSPORT SECTION
;  Define how Asterisk listens for SIP signalling
; ──────────────────────────────────────────────────────────────

; ── Standard UDP SIP transport (for the laptop softphone, ext 100) ──
[transport-udp]
type      = transport
protocol  = udp
bind      = 0.0.0.0:5060

; ── WebSocket transport (plain WS — for PoC without cert hassle) ──
;  SIP.js can connect via ws://10.0.0.1:8088/ws
;  NOTE: Chrome/Firefox require WSS for WebRTC getUserMedia in most cases.
;        Use transport-wss below for production. Use ws for local LAN PoC.
[transport-ws]
type      = transport
protocol  = ws
bind      = 0.0.0.0:8088

; ── WebSocket Secure transport (WSS — required for getUserMedia on HTTPS) ──
;  SIP.js connects via wss://10.0.0.1:8089/ws
;  Requires the self-signed cert created above.
[transport-wss]
type      = transport
protocol  = wss
bind      = 0.0.0.0:8089
cert_file = /etc/asterisk/keys/ast.crt
priv_key_file = /etc/asterisk/keys/ast.key


; ──────────────────────────────────────────────────────────────
;  EXTENSION 100 — COMMAND DESK (Operator Laptop Softphone)
;  Recommended softphone: Linphone, Zoiper, or MicroSIP
;  Protocol: Standard SIP/UDP — no WebRTC needed
; ──────────────────────────────────────────────────────────────

; Authentication object for ext 100
[auth100]
type     = auth
auth_type = md5
username  = 100
md5_cred  = REPLACE_WITH_MD5_OF_PASS
;  Generate MD5:  echo -n "100:asterisk:command100pass" | md5sum
;  Format: user:realm:password
;  Default realm is "asterisk" — check /etc/asterisk/pjsip.conf global section

; AOR (Address of Record) — where to find ext 100
[aor100]
type             = aor
max_contacts     = 2         ; Allow laptop + backup phone
qualify_frequency = 30       ; Send OPTIONS ping every 30s to detect liveness

; Endpoint definition for ext 100
[100]
type              = endpoint
context           = sar-dialplan   ; Which dialplan context handles calls
disallow          = all
allow             = ulaw           ; G.711 µ-law  — lowest CPU overhead
allow             = alaw           ; G.711 A-law
allow             = opus           ; Opus  — if Asterisk has codec_opus module
transport         = transport-udp
auth              = auth100
aors              = aor100
callerid          = "Command Desk" <100>
; WebRTC not required for the laptop softphone extension


; ──────────────────────────────────────────────────────────────
;  EXTENSION 200 — VICTIM WebRTC (Browser via SIP.js)
;  The victim's phone browser connects over WS/WSS.
;  WebRTC mandates DTLS-SRTP — Asterisk bridges to RTP for ext 100.
; ──────────────────────────────────────────────────────────────

; Authentication object for ext 200
[auth200]
type      = auth
auth_type = userpass
username  = 200
password  = victim200pass       ; Must match SIP_PASS in the HTML/JS frontend

; AOR for ext 200
[aor200]
type             = aor
max_contacts     = 5           ; Multiple victims could potentially register
remove_existing  = yes         ; Replace old registration (mobile devices reconnect)
qualify_frequency = 0          ; Don't qualify — WebRTC clients go offline often

; Endpoint definition for ext 200
[200]
type                   = endpoint
context                = sar-dialplan
transport              = transport-wss     ; WebRTC MUST use WS/WSS transport

disallow               = all
allow                  = opus             ; Opus preferred for WebRTC (browser-native)
allow                  = ulaw             ; Fallback codec

auth                   = auth200
aors                   = aor200
callerid               = "Rescue Victim"  <200>

; ── WebRTC-specific settings ──────────────────────────────────
; These three settings are mandatory for browser-based WebRTC
dtls_auto_generate_cert = yes       ; Auto-generate DTLS cert if none specified
;   Or specify manually:
;   dtls_cert_file = /etc/asterisk/keys/ast.crt
;   dtls_private_key = /etc/asterisk/keys/ast.key
dtls_verify         = fingerprint   ; Verify remote DTLS fingerprint (in SDP a=fingerprint)
dtls_setup          = actpass       ; Be flexible: browser is "active", Asterisk "passive"
dtls_rekey          = 0            ; No periodic rekeying (simplifies PoC)

; ICE (Interactive Connectivity Establishment)
ice_support         = yes           ; Enable ICE for NAT traversal
; NOTE: In this architecture, the browser behind ESP32 NAT will attempt
;       ICE. Asterisk must have a reachable IP. Add STUN or direct LAN:
rtcp_mux            = yes           ; Multiplex RTCP onto the RTP port (WebRTC requirement)

use_avpf            = yes           ; Use RTP/SAVPF (Secure Audio-Video Profile with Feedback)
                                    ; This is the WebRTC RTP profile — mandatory.
media_encryption    = dtls          ; Enforce DTLS-SRTP media encryption
media_use_received_transport = yes  ; Use the transport negotiated in SDP (WS/WSS)

; ──────────────────────────────────────────────────────────────
;  GLOBAL PJSIP SETTINGS
; ──────────────────────────────────────────────────────────────
[global]
type                  = global
max_forwards          = 70
user_agent            = SAR-PBX/1.0
default_realm         = asterisk
; endpoint_identifier_order = username,ip,anonymous
