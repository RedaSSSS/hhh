; ================================================================
;  ASTERISK PBX - pjsip.conf (CLEAN REWRITE)
;  Search & Rescue Proof of Concept
;  Tested on Asterisk 16
; ================================================================

[global]
type=global
user_agent=SAR-PBX

; ─────────────────────────────────────────────────────────────
;  TRANSPORTS
; ─────────────────────────────────────────────────────────────

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/ast.crt
priv_key_file=/etc/asterisk/keys/ast.key

; ─────────────────────────────────────────────────────────────
;  EXTENSION 100 - Command Desk (laptop softphone over UDP)
; ─────────────────────────────────────────────────────────────

[100]
type=endpoint
context=sar-dialplan
disallow=all
allow=ulaw
allow=alaw
auth=100-auth
aors=100-aor
transport=transport-udp
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
callerid="Command Desk" <100>

[100-auth]
type=auth
auth_type=userpass
username=100
password=command100pass

[100-aor]
type=aor
max_contacts=2

; ─────────────────────────────────────────────────────────────
;  EXTENSION 200 - Victim WebRTC (browser via SIP.js)
; ─────────────────────────────────────────────────────────────

[200]
type=endpoint
context=sar-dialplan
disallow=all
allow=ulaw
allow=opus
auth=200-auth
aors=200-aor
transport=transport-wss
webrtc=yes
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
rtcp_mux=yes
callerid="Rescue Victim" <200>

[200-auth]
type=auth
auth_type=userpass
username=200
password=victim200pass

[200-aor]
type=aor
max_contacts=5
remove_existing=yes
